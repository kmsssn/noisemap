server:
  port: 8082

spring:
  application:
    name: recording-service
  data:
    mongodb:
      uri: mongodb://mongodb:27017/noisemap_recordings
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

storage:
  audio:
    path: /data/audio

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}