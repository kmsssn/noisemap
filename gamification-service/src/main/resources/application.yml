server:
  port: 8085

spring:
  application:
    name: gamification-service
  datasource:
    url: jdbc:postgresql://postgres:5432/noisemap_gamification
    username: ${DB_USERNAME:noisemap}
    password: ${DB_PASSWORD:noisemap}
  jpa:
    hibernate:
      # Flyway управляет схемой — Hibernate только валидирует
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

services:
  user-service:
    url: http://user-service:8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
