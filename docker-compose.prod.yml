services:

  # === REVERSE PROXY (NGINX + AUTOSSL) ===

  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIENT_MAX_BODY_SIZE: 15M
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    networks:
      - noisemap-net

  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    networks:
      - noisemap-net

  # === INFRASTRUCTURE ===

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/config/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - noisemap-net

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - noisemap-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - noisemap-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    expose:
      - "5672"
      - "15672"
      - "15692"
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
             rabbitmq-server"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - noisemap-net

  # === APPLICATION SERVICES ===

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - noisemap-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NoiseWatch}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noisemap-net

  recording-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: recording-service
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      ML_SERVICE_URL: http://ml-classification:8000
    volumes:
      - audio_data:/data/audio
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  statistics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: statistics-service
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      PREDICTION_SERVICE_URL: http://ml-prediction:5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  gamification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gamification-service
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    restart: unless-stopped
    expose:
      - "8086"
    environment:
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      MODERATOR_IDS: ${MODERATOR_IDS:-}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  moderation-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: moderation-service
    restart: unless-stopped
    expose:
      - "8087"
    environment:
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  comment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: comment-service
    restart: unless-stopped
    expose:
      - "8088"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - noisemap-net


  admin-panel:
    build:
      context: https://github.com/kmsssn/noisemap-admin.git#main
    container_name: admin-panel
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${ADMIN_DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${ADMIN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - noisemap-net

  ml-classification:
    image: ghcr.io/${ML_OWNER_CLASSIFICATION:-nodirbekumarov04}/noise-classification:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      RABBITMQ_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASS: ${RABBIT_PASS}
      RABBITMQ_EXCHANGE: noisemap.events
      AUDIO_STORAGE_MOUNT: /data/audio
      DEFAULT_CALIBRATION_OFFSET: "96.0"
    volumes:
      - audio_data:/data/audio:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - noisemap-net

  # Прогноз шума (Михаил). Синхронный REST GET /predict. RabbitMQ и аудио не нужны.
  ml-prediction:
    image: ghcr.io/${ML_OWNER_PREDICTION:-mikhailkapitov}/noise-prediction:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - noisemap-net

  # === MONITORING ===

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - noisemap-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      VIRTUAL_HOST: ${GRAFANA_DOMAIN}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${GRAFANA_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    depends_on:
      - prometheus
    networks:
      - noisemap-net

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - noisemap-net

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - noisemap-net

volumes:
  postgres_data:
  mongo_data:
  audio_data:
  grafana_data:
  loki_data:
  certs:
  vhost:
  html:
  acme:

networks:
  noisemap-net:
    driver: bridge